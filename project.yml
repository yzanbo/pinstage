# XcodeGen の設定。`xcodegen generate` で Pinstage.xcodeproj を作る
name: Pinstage
options:
  bundleIdPrefix: app.pinstage
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  # 画面に依存しない中心のロジック（`swift test` でも同じソースを使う）。
  # アプリに埋め込むフレームワークにすると、自前の証明書で署名したときに読み込みを断られることがあるので、静的ライブラリにする
  PinstageCore:
    type: library.static
    platform: macOS
    sources:
      - path: PinstageCore/Sources/PinstageCore
    settings:
      base:
        PRODUCT_NAME: PinstageCore
        SKIP_INSTALL: YES

  Pinstage:
    type: application
    platform: macOS
    sources:
      - path: Pinstage
    dependencies:
      - target: PinstageCore
      # 更新の仕組み（Sparkle）。make が Vendor/Sparkle に取り寄せたものを、アプリに入れる
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
    info:
      path: Pinstage/Info.plist
      properties:
        CFBundleDisplayName: Pinstage
        CFBundleDevelopmentRegion: ja
        # 日本語のアプリだと宣言する（しないと、文字の欄の右クリックなど、macOS の部品が英語で出る）
        CFBundleLocalizations:
          - ja
        # アプリの版。1.0.0 より前は β 版（設定画面にも「0.1.0（β 版）」のように出る）。出すたびに上げる。CFBundleVersion（ビルド番号）も 1 つずつ上げる
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.productivity
        # メニューバーに常駐し、Dock には出さない
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # pinstage://… の URL で操作できるようにする（自動化。Stream Deck・Alfred・ターミナルの open など）
        CFBundleURLTypes:
          - CFBundleURLName: app.pinstage.Pinstage
            CFBundleURLSchemes:
              - pinstage
        # 更新（Sparkle）。版の一覧（appcast.xml）の場所
        SUFeedURL: https://raw.githubusercontent.com/yzanbo/pinstage/main/appcast.xml
        # 更新ファイルの署名を確かめる公開鍵（Pin シリーズで共通の鍵。Pinshelf と同じ値。空にすると、更新の機能を出さない）
        SUPublicEDKey: "fIyKq+2V6b4ohDcJu6T86VEbZV01mUdv7mWw5IE7cpY="
        # 新しい版を自動で確かめる（1 時間に 1 回。Sparkle が受け付けるいちばん短い間隔で、VS Code と同じ。設定の「一般」で切れる）
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
    entitlements:
      path: Pinstage/Pinstage.entitlements
      properties:
        # Team ID のない署名（自己署名の証明書・アドホック署名）では、Hardened Runtime のままだと、
        # アプリに入れた Sparkle の読み込みを断られるので、ライブラリの検証を切る（Pinshelf と同じ）
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinstage.Pinstage
        PRODUCT_NAME: Pinstage
        # 開発中はその場の署名（自分の Mac で動かす用）。make cert で作った「Pinstage Dev」があれば Makefile がそれを使う
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # ほかのアプリのウインドウを動かす（アクセシビリティの API）ため、App Sandbox は使わない
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # 型は既定で MainActor にする（画面まわりのコードが多いため）
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
        # アプリのアイコン（scripts/make-app-icon.swift で描いて、make icon で書き出す）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 自前の証明書（Pinstage Dev）で署名しても Debug の dylib の読み込みを断られないよう、Debug だけ Hardened Runtime を切る
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        # 配る版には、デバッガをつなぐための許可（get-task-allow）を入れない（何もしないと、Xcode がビルドのときに足す）
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  Pinstage:
    build:
      targets:
        Pinstage: all
    run:
      config: Debug
